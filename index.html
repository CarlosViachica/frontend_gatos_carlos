<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Gato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #dfe5eb;
            font-family: Arial, sans-serif;
            color: #1b1b1b;
        }

        .page {
            display: flex;
            gap: 36px;
            min-height: 100vh;
            padding: 28px 28px 0 28px;
        }

        .form-panel {
            width: 460px;
            min-height: 660px;
            background: #f3f3f3;
            border: 1px solid #d1d1d1;
            border-radius: 10px;
            padding: 22px 24px 16px;
        }

        .list-panel {
            flex: 1;
            min-height: 660px;
            background: #dfe8f0;
            border-radius: 10px;
            padding: 18px 18px 0 18px;
        }

        h2 {
            margin: 0 0 22px;
            font-size: 3rem;
            line-height: 1.1;
            font-weight: 700;
            color: #111;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 1.05rem;
            color: #1f1f1f;
        }

        .form-control {
            width: 100%;
            height: 42px;
            padding: 8px 12px;
            border: 1px solid #cfcfcf;
            border-radius: 6px;
            background: #f9f9f9;
            color: #1a1a1a;
            font-size: 1rem;
            outline: none;
        }

        .form-control::placeholder {
            color: #7f7f7f;
        }

        .form-control:focus {
            border-color: #8db8ff;
            box-shadow: 0 0 0 2px rgba(141, 184, 255, 0.15);
        }

        input[type="file"] {
            padding: 8px 10px;
            background: #f7f7f7;
        }

        #preview {
            display: none;
            width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #d1d1d1;
        }

        .btn-primary {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            background: #1a87e8;
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: #1479d1;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .list-header h3 {
            margin: 0;
            font-size: 2.15rem;
            font-weight: 700;
            color: #1c1c1c;
        }

        .btn-secondary {
            border: 1px solid #a2a2a2;
            background: transparent;
            color: #2f2f2f;
            border-radius: 5px;
            padding: 7px 14px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .empty-state {
            background: #efc1c7;
            color: #1a1a1a;
            border: 1px solid #dca6ae;
            border-radius: 4px;
            text-align: center;
            padding: 18px 12px;
            font-size: 1.04rem;
        }

        #resultado {
            display: none;
            margin-top: 16px;
            border-radius: 8px;
            padding: 12px 14px;
        }

        .alert-success {
            background: rgba(25, 135, 84, 0.12);
            border: 1px solid rgba(25, 135, 84, 0.4);
            color: #1f2d1f;
        }

        .alert-danger {
            background: rgba(220, 53, 69, 0.12);
            border: 1px solid rgba(220, 53, 69, 0.35);
            color: #2b1a1d;
        }

        .gato-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 10px;
            padding: 14px;
            margin-top: 12px;
        }

        .gato-item img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .gato-item h5 {
            margin: 0 0 8px;
            font-size: 1.08rem;
            color: #111;
        }

        .gato-item p {
            margin: 4px 0;
            font-size: 0.96rem;
            color: #2b2b2b;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="form-panel">
            <h2>Registro de Gato</h2>

            <form id="formGato">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" class="form-control" id="nombre" required placeholder="Ej: Michi">
                </div>

                <div class="form-group">
                    <label for="edad">Edad (años)</label>
                    <input type="number" class="form-control" id="edad" required min="0" step="0.1"
                        placeholder="Ej: 2.5">
                </div>

                <div class="form-group">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" class="form-control" id="peso" required min="0" step="0.1"
                        placeholder="Ej: 4.2">
                </div>

                <div class="form-group">
                    <label for="raza">Raza</label>
                    <input type="text" class="form-control" id="raza" required placeholder="Ej: Siames">
                </div>

                <div class="form-group">
                    <label for="imagen">Imagen del gato</label>
                    <input type="file" class="form-control" id="imagen" accept="image/*" required>
                    <img id="preview" alt="Vista previa">
                </div>

                <button type="submit" class="btn-primary">Registrar Gato</button>
            </form>

            <div id="resultado" role="alert"></div>
        </div>

        <div class="list-panel">
            <div class="list-header">
                <h3>Gatos Registrados</h3>
                <button id="btnActualizar" type="button" class="btn-secondary">Actualizar</button>
            </div>

            <div id="listaGatos">
                <div class="empty-state">Error al cargar los gatos. Intenta de nuevo.</div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://backend-carlos-gatos.onrender.com/gatos';

        const resultadoDiv = document.getElementById('resultado');
        const listaGatos = document.getElementById('listaGatos');

        document.getElementById('imagen').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const preview = document.getElementById('preview');

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
            } else {
                preview.src = '';
                preview.style.display = 'none';
            }
        });

        document.getElementById('formGato').addEventListener('submit', async (e) => {
            e.preventDefault();
            resultadoDiv.style.display = 'none';

            const formData = new FormData();
            formData.append('nombre', document.getElementById('nombre').value.trim());
            formData.append('edad', document.getElementById('edad').value);
            formData.append('peso', document.getElementById('peso').value);
            formData.append('raza', document.getElementById('raza').value.trim());

            const imagenInput = document.getElementById('imagen');
            if (imagenInput.files.length > 0) {
                formData.append('imagen', imagenInput.files[0]);
            }

            try {
                const respuesta = await fetch(BACKEND_URL, {
                    method: 'POST',
                    body: formData
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    resultadoDiv.className = 'alert-success';
                    resultadoDiv.innerHTML = data.mensaje + (data.imagenUrl ? `<br><img src="${data.imagenUrl}" style="max-width:100%;margin-top:10px;border-radius:8px;">` : '');
                    document.getElementById('formGato').reset();
                    document.getElementById('preview').style.display = 'none';
                    await cargarGatos();
                } else {
                    resultadoDiv.className = 'alert-danger';
                    resultadoDiv.textContent = data.mensaje || 'Error al registrar el gato';
                }

                resultadoDiv.style.display = 'block';
            } catch (error) {
                console.error(error);
                resultadoDiv.className = 'alert-danger';
                resultadoDiv.textContent = 'Error de conexión con el servidor.';
                resultadoDiv.style.display = 'block';
            }
        });

        async function cargarGatos() {
            try {
                const respuesta = await fetch(BACKEND_URL);
                const gatos = await respuesta.json();

                if (!Array.isArray(gatos) || gatos.length === 0) {
                    listaGatos.innerHTML = '<div class="empty-state">Error al cargar los gatos. Intenta de nuevo.</div>';
                    return;
                }

                listaGatos.innerHTML = gatos.map(gato => `
                    <div class="gato-item">
                        <img src="${gato.imagenUrl || 'https://via.placeholder.com/400x250?text=Sin+imagen'}" alt="${gato.nombre}">
                        <h5>${gato.nombre}</h5>
                        <p><strong>Edad:</strong> ${gato.edad} años</p>
                        <p><strong>Peso:</strong> ${gato.peso} kg</p>
                        <p><strong>Raza:</strong> ${gato.raza}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error(error);
                listaGatos.innerHTML = '<div class="empty-state">Error al cargar los gatos. Intenta de nuevo.</div>';
            }
        }

        document.getElementById('btnActualizar').addEventListener('click', cargarGatos);
        cargarGatos();
    </script>
</body>

</html>
